<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A minimal Markdown editor with live preview and automatic local saving.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https: http:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Markdown</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/markdown-it.min.js" defer></script>
  <script src="vendor/task-lists.min.js" defer></script>
  <script src="markdown.js" defer></script>
  <script src="vendor/purify.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="brand">
      <svg aria-hidden="true" width="26" height="22" viewBox="0 0 26 22" fill="none"><rect x="1" y="1" width="24" height="20" rx="4" stroke="currentColor" stroke-width="1.5"/><path d="M5 15V7l4 4 4-4v8m4-4 2 3 2-3m-2 3V7" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <h1>Markdown</h1>
    </div>
    <div class="header-actions">
      <span id="save-status" role="status" aria-live="polite">Saved in this browser</span>
      <button id="download" class="download" type="button">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg>
        Download<span class="extension"> .md</span>
      </button>
    </div>
  </header>
  <nav class="toolbar" aria-label="Editor controls">
    <div class="formatting" role="group" aria-label="Formatting">
      <button type="button" data-format="heading" title="Heading" aria-label="Insert heading">H<span class="subscript">1</span></button>
      <button type="button" data-format="bold" title="Bold (Ctrl/⌘ B)" aria-label="Bold"><strong>B</strong></button>
      <button type="button" data-format="italic" title="Italic (Ctrl/⌘ I)" aria-label="Italic"><em>I</em></button>
      <span class="separator" aria-hidden="true"></span>
      <button type="button" data-format="link" title="Link (Ctrl/⌘ K)" aria-label="Insert link"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m10 13 4-4m-5 7-2 2a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 0 2-2a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(1 0)"/></svg></button>
      <button type="button" data-format="code" title="Inline code" aria-label="Insert inline code"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16"/></svg></button>
      <button type="button" data-format="list" title="Bullet list" aria-label="Insert bullet list"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9 6h12M9 12h12M9 18h12M3 6h.01M3 12h.01M3 18h.01" stroke-width="2"/></svg></button>
    </div>
    <div class="view-switch" role="group" aria-label="View">
      <button type="button" data-view="edit" aria-pressed="false">Edit</button>
      <button type="button" data-view="split" aria-pressed="true">Split</button>
      <button type="button" data-view="preview" aria-pressed="false">Preview</button>
    </div>
  </nav>
  <main id="workspace" data-view="split">
    <section class="pane editor-pane" aria-label="Markdown editor">
      <div class="pane-heading"><label for="editor">Markdown</label><span>untitled.md</span></div>
      <textarea id="editor" aria-label="Markdown source" spellcheck="false" placeholder="# Start writing&#10;&#10;Your words, with a little Markdown." autocapitalize="off" autocomplete="off"></textarea>
    </section>
    <section class="pane preview-pane" aria-labelledby="preview-label">
      <div class="pane-heading"><span id="preview-label">Preview</span><span>Live</span></div>
      <div class="preview-scroll"><article id="preview" class="prose"></article><p id="empty-preview">Your preview will appear here.</p></div>
    </section>
  </main>
  <footer>
    <span id="word-count">0 words</span>
    <span class="footer-note">Stored locally. Just you and your words.</span>
    <span id="character-count">0 characters</span>
  </footer>
  <noscript>This editor needs JavaScript to preview and save your writing.</noscript>
</body>
</html>
